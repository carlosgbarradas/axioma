  const mid=member("M",first[2]), end=member("P",neg);

    p(p1),p(p2),arb,hyp("y ∈ S"),

    R("3–7","Generalización universal",quant("S","P",neg),"El elemento era arbitrario, así que el resultado vale para todo x.",1)
  ],sourceLogic);

    R(u+", "+(via===mt?([third,fourth].indexOf(member(ub,!un))+3):([third,fourth].indexOf(member(ua))+3)),via,derived,"Aplica la premisa universal a la propiedad del testigo.",1),

  ],sourceLogic);

"use strict";
const TAU=Math.PI*2;
function prepareCanvas(canvas,w,h){
  const width=canvas.clientWidth;
  const height=canvas.clientHeight;
  if(!width||!height)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(width*dpr);
  canvas.height=Math.round(height*dpr);
  const g=canvas.getContext("2d");
  const s=Math.min(width/w,height/h);
  g.setTransform(s*dpr,0,0,s*dpr,(width-w*s)*dpr/2,(height-h*s)*dpr/2);
  g.lineJoin="round";g.lineCap="round";return g;
}
function stroke(g,points,color,width=1,dash=[]){
  g.save();g.strokeStyle=color;g.lineWidth=width;g.setLineDash(dash);g.beginPath();
  points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();g.restore();
}
function ellipse(g,x,y,rx,ry,line,fill,tilt=0){
  g.beginPath();g.ellipse(x,y,rx,ry,tilt,0,TAU);
  if(fill){g.fillStyle=fill;g.fill()}
  if(line){g.strokeStyle=line;g.stroke()}
}
function label(g,t,x,y,col,size=15){
  g.fillStyle=col;g.font="italic "+size+"px Georgia, serif";g.fillText(t,x,y)
}
function torus(canvas){
  const g=prepareCanvas(canvas,490,270);if(!g)return;
  const cx=245,cy=139, axis="#9384af";
  stroke(g,[[43,205],[448,76]],axis,.8,[4,4]);
  stroke(g,[[80,64],[413,220]],axis,.8,[4,4]);
  stroke(g,[[246,245],[246,17]],axis,.9,[4,4]);
  label(g,"x",450,75,axis,14);label(g,"y",417,225,axis,14);label(g,"z",250,22,axis,14);
  const sx=0.83, cxr=Math.sqrt(1-sx*sx), ang=-.23, ca=Math.cos(ang),sa=Math.sin(ang);
  function project(u,v){
    const rr=99+43*Math.cos(v),x=rr*Math.cos(u),y=rr*Math.sin(u),z=43*Math.sin(v);
    const b=y*cxr-z*sx,depth=y*sx+z*cxr;
    return [cx+1.22*(x*ca-b*sa),cy+1.22*(x*sa+b*ca),depth];
  }
  const mesh=[],nu=68,nv=32;
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
    const u=TAU*i/nu,v=TAU*j/nv;
    const pts=[project(u,v),project(u+TAU/nu,v),project(u+TAU/nu,v+TAU/nv),project(u,v+TAU/nv)];
    const light=(.5+.5*(.56*Math.sin(v)-.52*Math.cos(u)*Math.cos(v)-.30*Math.sin(u)*Math.cos(v)));
    mesh.push({pts,depth:pts.reduce((a,p)=>a+p[2],0)/4,light});
  }
  mesh.sort((a,b)=>a.depth-b.depth);
  for(const q of mesh){
    g.beginPath();q.pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();
    g.fillStyle="hsl(259 72% "+(51+39*q.light)+"%)";g.fill();
    g.strokeStyle="rgba(76,40,145,.78)";g.lineWidth=.77;g.stroke();
  }
  // An unobtrusive leader identifies the mathematical surface.
  stroke(g,[[334,185],[355,208],[415,208]],"#78629d",.9);
  ellipse(g,334,185,2,2,null,"#7958b3");
  label(g,"Toro de revolución",351,224,"#725a91",12);
}

 Pega aquí la "Project URL" y la clave "anon public" de tu proyecto

 SQL para crear la tabla (Supabase → SQL Editor → Run):
   create table public.progress (
     user_id uuid primary key references auth.users(id) on delete cascade,
     data jsonb not null default '{}'::jsonb,
     updated_at timestamptz not null default now()
   );
   alter table public.progress enable row level security;
   create policy "leer mi progreso" on public.progress
     for select using (auth.uid() = user_id);
   create policy "crear mi progreso" on public.progress
     for insert with check (auth.uid() = user_id);
   create policy "actualizar mi progreso" on public.progress
     for update using (auth.uid() = user_id) with check (auth.uid() = user_id);

const CLOUD={url:"",anonKey:""};

const root=document.querySelector("main"),LEGACY="axioma.study.v1",SESSION="axioma.session",USERS="axioma.users";
const blankState=()=>({done:{},errors:{},runs:{},last:null,notes:{},help:{},evidence:{},workshops:{}});
let data=blankState(),key=null,user=null,sb=null,booted=false,syncState="",pushTimer=null,pushing=false,pushAgain=false,authTab="login",authMsg="",authBusy=false;
let saveFailed=false;
const cloudOn=()=>!!(CLOUD.url&&CLOUD.anonKey);
function readLS(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
function writeLS(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
function niceName(n,email){n=String(n||"").trim()||String(email||"").split("@")[0].split(/[._\-+]/)[0]||"Estudiante";return n.charAt(0).toUpperCase()+n.slice(1)}
function initial(u){return String(u?.name||u?.email||"?").charAt(0).toUpperCase()}
function knownUsers(){const u=readLS(USERS);return Array.isArray(u)?u:[]}
function remember(u){writeLS(USERS,[{email:u.email,name:u.name},...knownUsers().filter(x=>x.email!==u.email)].slice(0,6))}
function adopt(u,remote){
 user=u;key=LEGACY+":"+u.id;remember(u);
 let saved=remote||readLS(key);
 if(!saved){const legacy=readLS(LEGACY);if(legacy){saved=legacy;writeLS(LEGACY,null)}}
 data=Object.assign(blankState(),saved||{});writeLS(key,data);
}
function save(){
 if(!user)return;
 data._t=Date.now();
 if(!writeLS(key,data)&&!saveFailed){saveFailed=true;announce("El navegador no permite guardar el avance.")}
 if(sb){clearTimeout(pushTimer);pushTimer=setTimeout(pushCloud,700);setSync("saving")}
}
const syncLabels={saving:"Guardando…",saved:"Guardado",error:"Sin conexión"};
function setSync(st){syncState=st;const el=document.querySelector("#sync");if(el){el.className="sync "+st;el.textContent=syncLabels[st]||""}}
async function pushCloud(){
 if(!sb||!user)return;
 if(pushing){pushAgain=true;return}
 pushing=true;clearTimeout(pushTimer);setSync("saving");
 const who=user.id;let failed=false;
 try{const {error}=await sb.from("progress").upsert({user_id:who,data,updated_at:new Date().toISOString()});if(error)failed=true}catch{failed=true}
 pushing=false;
 if(!user||user.id!==who)return;
 if(failed){setSync("error");pushTimer=setTimeout(pushCloud,8000);return}
 if(pushAgain){pushAgain=false;pushCloud()}else setSync("saved");
}
function loadScript(src){return new Promise((ok,fail)=>{const el=document.createElement("script");el.src=src;el.onload=ok;el.onerror=fail;document.head.appendChild(el)})}
async function enterCloud(u){
 const name=niceName(u.user_metadata?.name,u.email);
 let remote=null,reached=false;
 try{const {data:row,error}=await sb.from("progress").select("data").eq("user_id",u.id).maybeSingle();if(error)throw error;remote=row?.data||null;reached=true}catch{}
 const cached=readLS(LEGACY+":"+u.id);
 const pick=remote&&cached?((cached._t||0)>(remote._t||0)?cached:remote):remote;
 adopt({id:u.id,email:u.email,name},pick);
 if(!reached)setSync("error");else if(pick!==remote||!remote)pushCloud();else setSync("saved");
}
async function boot(){
 if(cloudOn()){
  try{await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");sb=window.supabase.createClient(CLOUD.url,CLOUD.anonKey)}
  catch{sb=null;authMsg="No se pudo conectar con el servidor de Axioma. Revisa tu conexión y recarga la página."}
  if(sb){
   try{const {data:{session}}=await sb.auth.getSession();if(session)await enterCloud(session.user)}catch{}
   try{sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"&&user){user=null;key=null;data=blankState();render()}})}catch{}
  }
 }else{
  const ses=readLS(SESSION);if(ses?.email)adopt({id:ses.email,email:ses.email,name:niceName(ses.name,ses.email)});
 }
 booted=true;render();
}
function authError(e){const m=String(e?.message||e||"");
 if(/invalid login credentials/i.test(m))return "Correo o contraseña incorrectos.";
 if(/already registered|already exists/i.test(m))return "Ese correo ya tiene cuenta. Usa «Entrar».";
 if(/not confirmed/i.test(m))return "Confirma tu correo con el enlace que te llegó y vuelve a intentarlo.";
 if(/password/i.test(m))return "Elige una contraseña de al menos 6 caracteres.";
 if(/fetch|network|failed to/i.test(m))return "No hay conexión con el servidor. Intenta de nuevo.";
 if(/rate limit/i.test(m))return "Demasiados intentos seguidos. Espera un momento.";
 return "No se pudo completar: "+m}
async function submitAuth(form){
 const email=form.email.value.trim().toLowerCase(),pass=form.password?form.password.value:"",name=form.elements.name?form.elements.name.value:"";
 const submit=form.querySelector('button[type="submit"]');
 const say=t=>{authMsg=t;const el=root.querySelector("#auth-msg");if(el)el.textContent=t};
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){say("Escribe un correo válido.");form.email.focus();return}
 if(!sb){if(cloudOn()){say("Sin conexión con el servidor. Recarga la página.");return}
  const u={id:email,email,name:niceName(name||knownUsers().find(x=>x.email===email)?.name,email)};writeLS(SESSION,u);adopt(u);authMsg="";go("home");return}
 if(pass.length<6){say("La contraseña debe tener al menos 6 caracteres.");form.password.focus();return}
 authBusy=true;submit.disabled=true;say(authTab==="signup"?"Creando tu cuenta…":"Entrando…");
 try{
  const res=authTab==="signup"?await sb.auth.signUp({email,password:pass,options:{data:{name:niceName(name,email)}}}):await sb.auth.signInWithPassword({email,password:pass});
  if(res.error)throw res.error;
  if(!res.data.session){authTab="login";say("Te enviamos un correo para confirmar tu cuenta. Confírmala y luego entra aquí.");return}
  await enterCloud(res.data.session.user);authMsg="";go("home");
 }catch(e){say(authError(e))}
 finally{authBusy=false;if(submit.isConnected)submit.disabled=false}
}
async function signOut(){
 clearTimeout(pushTimer);
 if(sb&&user){try{if(syncState!=="saved")await pushCloud()}catch{}try{await sb.auth.signOut()}catch{}}
 else writeLS(SESSION,null);
 user=null;key=null;data=blankState();syncState="";authMsg="";
 history.replaceState(null,"","#/home");render();
}

 rerenderQuestion();return;
 }
 if(a==="reveal"){markSupport(page,p,n,i,"model");feedback={ok:false,revealed:true,title:"Respuesta modelo.",text:row.hint};setError(p,i);rerenderQuestion();return}
 if(a==="next"&&(feedback?.ok||feedback?.revealed)){
   const recorded=resultForStep(page,p,n,i);
   if(page==="reforzar"){
    localReset();const next=pendingSteps(p,n).find(index=>index!==i);
    if(next!=null)go("reforzar/"+p.id+"/"+n+"/"+next);
    else if(recorded==="solo"){render();window.scrollTo(0,0)}else go("progress");
    return;
   }
   if(page==="review"){localReset();render();window.scrollTo(0,0);return}
   if(s.pos+1>=s.order.length){finish(p,n);return}
   s.pos++;save();localReset();render();root.querySelector(".question")?.scrollIntoView({block:"center"});return;
 }
});
root.addEventListener("input",e=>{
 if(["lab-notes","lab-repair"].includes(e.target.id)){
  const [,mode,id]=route(),s=caseState(mode,id);
  s[e.target.id==="lab-notes"?"notes":"correction"]=e.target.value;s.message="";save();return;
 }
 if(e.target.id==="search"){searchTerm=e.target.value;document.querySelector("#results").innerHTML=referenceCards();return}
 if(e.target.id==="answer"){answerText=e.target.value;const b=root.querySelector('[data-act="check"]');if(b)b.disabled=!answerText.trim();return}
 if(e.target.dataset.note){const {s}=boundContext(),[i,j]=e.target.dataset.note.split(",").map(Number);s.draft[i][j]=e.target.value;save()}
});
root.addEventListener("submit",e=>{if(e.target.id==="auth-form"){e.preventDefault();if(!authBusy)submitAuth(e.target)}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&sb&&user&&syncState!=="saved")pushCloud()});
root.addEventListener("keydown",e=>{if(e.target.id==="answer"&&e.key==="Enter")root.querySelector('[data-act="check"]:not(:disabled)')?.click()});
root.addEventListener("change",e=>{
 if(e.target.id==="photo"){const f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/")){announce("Selecciona un archivo de imagen.");return}disposePhoto();photo={url:URL.createObjectURL(f)};rerenderQuestion()}
});
window.addEventListener("hashchange",()=>{
 localReset();setupId=null;practiceKey="";reviewId="";disposePhoto();
 {const [pg,md,cid]=route(),w=user&&data.workshops[md+"/"+cid];if(pg==="taller"&&w)w.message=""}
 render();window.scrollTo(0,0);root.focus({preventScroll:true})
});
boot();


</script></body></html>
